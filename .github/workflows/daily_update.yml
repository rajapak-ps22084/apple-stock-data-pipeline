name: Daily Stock Data Update

on:
  schedule:
    # Runs every day at 09:00 UTC. Adjust the cron time if you want a
    # different time — cron times are always in UTC, not local time.
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Lets you also trigger this manually from the GitHub Actions tab,
    # useful for testing without waiting for the schedule.

permissions:
  contents: write
  # Without this, GitHub Actions' default token is read-only and the
  # final "git push" step fails with exit code 128 (permission denied).

jobs:
  update-stock-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest data and regenerate chart
        run: python cloud_update.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Stock_Project.db apple_stock_graph.png
          git diff --quiet --cached || git commit -m "Automated daily stock data update"
          git push
